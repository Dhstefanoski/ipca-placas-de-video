name: Analise semanal

on:
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar analise
        run: |
          python src/hedonico.py
          python src/medianas.py
          python src/graficos.py
          python src/exploracao.py
          python src/modelo.py
      - name: Salvar resultados
        run: |
          git config user.name  "coletor-automatico"
          git config user.email "coletor@users.noreply.github.com"
          git add dados figuras
          git diff --cached --quiet && exit 0
          git commit -m "analise $(date -u +%F)"
          git pull --rebase
          git push
