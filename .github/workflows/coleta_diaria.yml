name: Coleta diaria de precos

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "29 15 * * *"
    - cron: "43 20 * * *"
    - cron: "37 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Coletar precos
        run: python src/coleta_diaria.py
      - name: Salvar no repositorio
        run: |
          git config user.name  "coletor-automatico"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/precos_diarios.csv
          git diff --cached --quiet && exit 0
          git commit -m "coleta $(date -u +%F)"
          git pull --rebase
          git push
