name: Coleta diaria de precos

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar precos
        run: python src/coleta_diaria.py
      - name: Salvar no repositorio
        run: |
          git config user.name  "coletor-automatico"
          git config user.email "coletor@users.noreply.github.com"
          git add dados/precos_diarios.csv
          git diff --cached --quiet || git commit -m "coleta $(date -u +%F)"
          git push
